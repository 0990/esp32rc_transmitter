; ExpressLRS PlatformIO Project Configuration File

[platformio]

[env]
#upload_port =
#upload_speed =
framework = arduino
monitor_dtr = 0
monitor_rts = 0


[common_env_data]
build_src_filter = +<*> -<.git/> -<svn/> -<example/> -<examples/> -<test/> -<tests/> -<*.py> -<*test*.*>
build_flags = -Wall -Iinclude
build_flags_tx = -DTARGET_TX=1 ${common_env_data.build_flags}
build_flags_rx = -DTARGET_RX=1 ${common_env_data.build_flags}

;mavlink_lib_dep = https://github.com/mavlink/c_library_v2.git#e54a8d2e8cf7985e689ad1c8c8f37dc0800ea87b

# ------------------------- COMMON ESP32 DEFINITIONS -----------------

[env_common_esp32]
platform = espressif32@6.12.0
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_speed = 460800
monitor_speed = 460800
upload_resetmethod = nodemcu
board_build.f_cpu = 240000000L
monitor_filters = esp32_exception_decoder
; extra_scripts =
; 	${env.extra_scripts}
	;pre:python/copy_html.py
build_flags =
	-D PLATFORM_ESP32=1
	-D CONFIG_TCPIP_LWIP=1
	-D BEARSSL_SSL_BASIC
	-D CONFIG_DISABLE_HAL_LOCKS=1
	-I ${PROJECTSRC_DIR}/hal
build_src_filter = ${common_env_data.build_src_filter} -<ESP8266*.*>
lib_deps =
	;esp32async/AsyncTCP @ 3.4.8
	;h2zero/NimBLE-Arduino @ 2.3.6
	;lemmingdev/ESP32-BLE-Gamepad @ 0.7.4
	;bblanchon/ArduinoJson @ 7.4.2
	;${common_env_data.mavlink_lib_dep}
oled_lib_deps =
	${env_common_esp32.lib_deps}
	;olikraus/U8g2 @ 2.36.12
tft_lib_deps =
	${env_common_esp32.lib_deps}
	;moononournation/GFX Library for Arduino @ 1.6.0

[env_common_esp32s3tx]
extends = env_common_esp32
board = esp32-s3-devkitc-1
build_flags =
	${env_common_esp32.build_flags}
	-D PLATFORM_ESP32_S3=1
	-D ARDUINO_USB_MODE

[env:Unified_ESP32S3_TX]
extends = env_common_esp32s3tx
build_flags =
	${env_common_esp32s3tx.build_flags}
	${common_env_data.build_flags_tx}
	-include target/Unified_ESP32_TX.h
	-D VTABLES_IN_FLASH=1
	-O2
build_src_filter = ${env_common_esp32s3tx.build_src_filter} -<rx_*.cpp> -<rx-*/>
lib_deps =
    ${env_common_esp32s3tx.tft_lib_deps}
    ${env_common_esp32s3tx.oled_lib_deps}
	SPIFFS
upload_speed = 460800
monitor_speed = 420000
debug_tool = esp-builtin
debug_init_break = break setup
; 如果你要启用 USB-JTAG，需要打开以下串口配置
upload_protocol = esp-builtin

[env:Unified_ESP32S3XIAO_TX]
extends = env_common_esp32s3tx
build_flags =
	${env_common_esp32s3tx.build_flags}
	${common_env_data.build_flags_tx}
	-include target/Unified_ESP32_TX.h
	-D VTABLES_IN_FLASH=1
	-O2
build_src_filter = ${env_common_esp32s3tx.build_src_filter} -<rx_*.cpp> -<rx-*/>
lib_deps =
    ${env_common_esp32s3tx.tft_lib_deps}
    ${env_common_esp32s3tx.oled_lib_deps}
	SPIFFS
upload_speed = 460800
monitor_speed = 420000
